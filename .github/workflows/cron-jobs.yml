# GitHub Actions Cron Jobs
# Alternativa gratuita a Vercel Cron Jobs (limitado a 2 en plan free)
#
# Documentacion: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
#
# IMPORTANTE: Agregar CRON_SECRET en GitHub Secrets:
# 1. Ir a: https://github.com/mvialf/cobralon-v3/settings/secrets/actions
# 2. Click "New repository secret"
# 3. Name: CRON_SECRET
# 4. Value: (el mismo valor que usarias en Vercel)

name: Scheduled Cron Jobs

on:
  schedule:
    # Ejecutar todos los dias a las 00:00 UTC (21:00 Chile, 20:00 Argentina)
    # Sintaxis: minuto hora dia-mes mes dia-semana
    - cron: '0 0 * * *'

  # Permitir ejecucion manual para testing
  workflow_dispatch:

jobs:
  mark-installments-paid:
    name: Mark Due Installments as Paid
    runs-on: ubuntu-latest

    steps:
      - name: Call Vercel API endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://cobralon.vercel.app/api/cron/mark-installments-paid" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          # Separar body y status code
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          # Fallar si no es 2xx
          if [[ ! "$http_code" =~ ^2 ]]; then
            echo "Error: API returned status $http_code"
            exit 1
          fi

          echo "Cron job executed successfully"
